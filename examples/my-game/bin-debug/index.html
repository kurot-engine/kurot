<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
	<title>Blakron Game</title>
	<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#000000;overflow:hidden;}canvas{display:block;}</style>
	<script type="importmap">
	{
		"imports": {
			"@blakron/core": "./js/blakron.core.js",
			"@blakron/game": "./js/blakron.game.js",
			"@blakron/ui": "./js/blakron.ui.js"
		}
	}
	</script>
</head>
<body>
	<canvas id="gameCanvas"
		data-content-width="640"
		data-content-height="1136"
		data-scale-mode="showAll"
		data-orientation="auto"
		data-frame-rate="60"></canvas>
	<script type="module" src="Main.js"></script>
</body>
</html>
