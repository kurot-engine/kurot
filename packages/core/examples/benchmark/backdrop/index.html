<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<title>BackdropBlur GPU benchmark</title>
		<style>
			body { margin: 24px; background: #0b1020; color: #e2e8f0; font: 14px system-ui; }
			#viewport { width: 960px; height: 540px; }
			canvas { width: 100%; height: 100%; }
			pre { white-space: pre-wrap; }
		</style>
	</head>
	<body>
		<h1>BackdropBlur GPU 计时</h1>
		<p>960 × 540 逻辑尺寸，2× 画布；预热后使用 GPU timer query 测量整帧，不把 CPU 提交时间当 GPU 耗时。</p>
		<button id="run">开始测量</button>
		<pre id="result">准备就绪。需要浏览器支持 EXT_disjoint_timer_query_webgl2。</pre>
		<div id="viewport"><canvas></canvas></div>
		<script type="module">
			import { runBackdropBenchmark } from './BackdropBenchmark.ts';
			const button = document.querySelector('#run');
			button.onclick = async () => {
				button.disabled = true;
				try {
					document.querySelector('#result').textContent = JSON.stringify(await runBackdropBenchmark(), undefined, 2);
				} catch (error) {
					document.querySelector('#result').textContent = String(error);
				} finally {
					button.disabled = false;
				}
			};
		</script>
	</body>
</html>
