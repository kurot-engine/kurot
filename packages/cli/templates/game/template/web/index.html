<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
	<title>Kurot Game</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #000000;
			overflow: hidden;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		canvas {
			display: block;
		}

		.web-splash {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #000000;
			transition: opacity 240ms ease;
		}

		.web-splash--hidden {
			opacity: 0;
			pointer-events: none;
		}

		.web-splash__brand {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 16px;
		}

		.web-splash__caption {
			color: rgba(205, 230, 255, 0.6);
			font: 600 11px/1.4 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
			letter-spacing: 0.04em;
		}

		.web-splash__mascot {
			position: relative;
			width: min(52vw, 50vh, 240px);
			isolation: isolate;
		}

		.web-splash__mascot::before {
			content: '';
			position: absolute;
			inset: -18%;
			z-index: -1;
			background: radial-gradient(circle, rgba(30, 145, 255, 0.14), transparent 68%);
		}

		.web-splash__logo {
			display: block;
			width: 100%;
			height: auto;
			transform-origin: 50% 80%;
			animation: web-splash-arrive 720ms ease-out both,
				web-splash-float 3.6s ease-in-out 720ms infinite;
		}

		.web-splash__spark {
			position: absolute;
			width: 14px;
			height: 14px;
			opacity: 0;
			animation: web-splash-spark 900ms ease-out 260ms both;
		}

		.web-splash__spark::before,
		.web-splash__spark::after {
			content: '';
			position: absolute;
			inset: 0;
			margin: auto;
			border-radius: 999px;
			background: #91e5ff;
		}

		.web-splash__spark::before {
			width: 100%;
			height: 3px;
		}

		.web-splash__spark::after {
			width: 3px;
			height: 100%;
		}

		.web-splash__spark--left {
			left: -4%;
			top: 24%;
		}

		.web-splash__spark--right {
			right: -4%;
			top: 52%;
			width: 10px;
			height: 10px;
			animation-delay: 460ms;
		}

		@keyframes web-splash-arrive {
			0% { transform: translateY(12px) scale(0.92) rotate(-4deg); }
			60% { transform: translateY(-6px) scale(1.025) rotate(2deg); }
			100% { transform: translateY(0) scale(1) rotate(0); }
		}

		@keyframes web-splash-float {
			0%, 100% { transform: translateY(0) rotate(0); }
			50% { transform: translateY(-5px) rotate(1deg); }
		}

		@keyframes web-splash-spark {
			0% { opacity: 0; transform: scale(0.4) rotate(-20deg); }
			35% { opacity: 0.85; transform: scale(1) rotate(10deg); }
			100% { opacity: 0; transform: scale(0.6) rotate(30deg); }
		}

		@media (prefers-reduced-motion: reduce) {
			.web-splash__logo,
			.web-splash__spark {
				animation: none;
			}
		}
	</style>
	{{KUROT_IMPORT_MAP}}
</head>
<body>
	<div id="webSplash" class="web-splash" role="img" aria-label="Made with Kurot">
		<div class="web-splash__brand">
			<span class="web-splash__caption">Made with</span>
			<div class="web-splash__mascot">
				<img class="web-splash__logo" src="logo.png" alt="">
				<span class="web-splash__spark web-splash__spark--left" aria-hidden="true"></span>
				<span class="web-splash__spark web-splash__spark--right" aria-hidden="true"></span>
			</div>
		</div>
	</div>
	<canvas id="gameCanvas"
		data-content-width="{{KUROT_STAGE_WIDTH}}"
		data-content-height="{{KUROT_STAGE_HEIGHT}}"
		data-scale-mode="{{KUROT_SCALE_MODE}}"
		data-orientation="{{KUROT_ORIENTATION}}"
		data-frame-rate="{{KUROT_FRAME_RATE}}"></canvas>
	<script type="module">
		import './{{KUROT_ENTRY_SCRIPT}}';

		const splash = document.getElementById('webSplash');
		requestAnimationFrame(() => {
			splash.classList.add('web-splash--hidden');
			splash.addEventListener('transitionend', () => splash.remove(), { once: true });
		});
	</script>
</body>
</html>
