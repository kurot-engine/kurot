<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
	<title>Blakron Game</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #000000;
			overflow: hidden;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		canvas {
			display: block;
		}

		.web-loading {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #000000;
			transition: opacity 240ms ease;
		}

		.web-loading--hidden {
			opacity: 0;
			pointer-events: none;
		}

		.web-loading__logo {
			display: block;
			width: min(42vw, 220px);
			height: auto;
			animation: web-loading-pulse 1.8s ease-in-out infinite;
		}

		.web-loading__indicator {
			width: 26px;
			height: 26px;
			margin-top: 20px;
			border: 2px solid rgba(143, 225, 235, 0.18);
			border-top-color: #8fe1eb;
			border-radius: 50%;
			animation: web-loading-spin 800ms linear infinite;
		}

		.web-loading__text {
			margin-top: 12px;
			color: rgba(255, 255, 255, 0.58);
			font: 11px/1 Arial, sans-serif;
			letter-spacing: 0.28em;
			text-indent: 0.28em;
		}

		@keyframes web-loading-pulse {
			0%, 100% { opacity: 0.72; transform: scale(0.98); }
			50% { opacity: 1; transform: scale(1); }
		}

		@keyframes web-loading-spin {
			to { transform: rotate(360deg); }
		}

		@media (prefers-reduced-motion: reduce) {
			.web-loading__logo,
			.web-loading__indicator {
				animation: none;
			}
		}
	</style>
	{{BLAKRON_IMPORT_MAP}}
</head>
<body>
	<div id="webLoading" class="web-loading" role="status" aria-label="Loading">
		<img class="web-loading__logo" src="logo.png" alt="">
		<div class="web-loading__indicator" aria-hidden="true"></div>
		<div class="web-loading__text">LOADING</div>
	</div>
	<canvas id="gameCanvas"
		data-content-width="{{BLAKRON_STAGE_WIDTH}}"
		data-content-height="{{BLAKRON_STAGE_HEIGHT}}"
		data-scale-mode="{{BLAKRON_SCALE_MODE}}"
		data-orientation="{{BLAKRON_ORIENTATION}}"
		data-frame-rate="{{BLAKRON_FRAME_RATE}}"></canvas>
	<script type="module">
		import './{{BLAKRON_ENTRY_SCRIPT}}';

		const loading = document.getElementById('webLoading');
		requestAnimationFrame(() => {
			loading.classList.add('web-loading--hidden');
			loading.addEventListener('transitionend', () => loading.remove(), { once: true });
		});
	</script>
</body>
</html>
