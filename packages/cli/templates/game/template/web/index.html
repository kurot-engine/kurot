<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
	<title>Kurot Game</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #000000;
			overflow: hidden;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		canvas {
			display: block;
		}

		.web-loading {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #000000;
			transition: opacity 240ms ease;
		}

		.web-loading--hidden {
			opacity: 0;
			pointer-events: none;
		}

		.web-loading__logo {
			display: block;
			width: min(48vw, 42vh, 220px);
			height: auto;
			animation: web-loading-bob 2.2s ease-in-out infinite;
		}

		.web-loading__indicator {
			width: 112px;
			height: 8px;
			margin-top: 24px;
			overflow: hidden;
			background: rgba(32, 171, 255, 0.18);
			border-radius: 999px;
		}

		.web-loading__indicator::before {
			content: '';
			display: block;
			width: 40%;
			height: 100%;
			border-radius: inherit;
			background: linear-gradient(90deg, #168cff, #38c9ff);
			transform: translateX(75%);
			animation: web-loading-slide 1.4s ease-in-out infinite alternate;
		}

		.web-loading__text {
			margin-top: 12px;
			color: rgba(255, 255, 255, 0.72);
			font: 600 12px/1.4 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
			letter-spacing: 0.04em;
		}

		@keyframes web-loading-bob {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(-3px); }
		}

		@keyframes web-loading-slide {
			from { transform: translateX(0); }
			to { transform: translateX(150%); }
		}

		@media (prefers-reduced-motion: reduce) {
			.web-loading__logo,
			.web-loading__indicator::before {
				animation: none;
			}
		}
	</style>
	{{KUROT_IMPORT_MAP}}
</head>
<body>
	<div id="webLoading" class="web-loading" role="status" aria-label="Loading">
		<img class="web-loading__logo" src="logo.png" alt="">
		<div class="web-loading__indicator" aria-hidden="true"></div>
		<div class="web-loading__text">Loading…</div>
	</div>
	<canvas id="gameCanvas"
		data-content-width="{{KUROT_STAGE_WIDTH}}"
		data-content-height="{{KUROT_STAGE_HEIGHT}}"
		data-scale-mode="{{KUROT_SCALE_MODE}}"
		data-orientation="{{KUROT_ORIENTATION}}"
		data-frame-rate="{{KUROT_FRAME_RATE}}"></canvas>
	<script type="module">
		import './{{KUROT_ENTRY_SCRIPT}}';

		const loading = document.getElementById('webLoading');
		requestAnimationFrame(() => {
			loading.classList.add('web-loading--hidden');
			loading.addEventListener('transitionend', () => loading.remove(), { once: true });
		});
	</script>
</body>
</html>
