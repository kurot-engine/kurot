name: SDK verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.package }} · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [core, ui, game, cli, ui-document, ui-runtime, atlas, dragonbones, bitmap-font]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.33.0
      # UI's Vitest config aliases Core to its source instead of the npm peer.
      - if: matrix.package == 'ui'
        run: pnpm --dir packages/core install --frozen-lockfile
      - run: pnpm --dir packages/${{ matrix.package }} install --frozen-lockfile
      - run: pnpm --dir packages/${{ matrix.package }} build
      - run: pnpm --dir packages/${{ matrix.package }} test
      - name: Create and build both templates using the packed CLI
        if: matrix.package == 'cli'
        run: bash tools/ci/check-cli-templates.sh
      - name: Switch to the oldest supported runtime for the CLI smoke test
        if: matrix.package == 'cli'
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - if: matrix.package == 'cli'
        run: npm install --global pnpm@10.33.0
      - name: Verify both packed templates at the Node 22.12.0 floor
        if: matrix.package == 'cli'
        run: bash tools/ci/check-cli-templates.sh

  browser:
    name: ${{ matrix.package }} · Chromium
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [core, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.33.0
      # UI browser fixtures load Core source and its bitmap-font dependency.
      - run: pnpm --dir packages/core install --frozen-lockfile
      - if: matrix.package == 'ui'
        run: pnpm --dir packages/ui install --frozen-lockfile
      - if: matrix.package == 'ui'
        run: pnpm --dir packages/ui build
      - if: matrix.package == 'core'
        name: Run Core browser tests with a non-silent MP3 fixture
        run: |
          if ! command -v ffmpeg >/dev/null; then
            apt-get update -qq
            apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -v error -f lavfi -i sine=frequency=440:sample_rate=44100:duration=0.37 -c:a libmp3lame /tmp/kurot-loop.mp3
          KUROT_AUDIO_FIXTURE=/tmp/kurot-loop.mp3 pnpm --dir packages/core exec playwright test --config examples/visual-regression/playwright.config.ts --update-snapshots=none
      - if: matrix.package == 'ui'
        run: pnpm --dir packages/ui test:text-labels
